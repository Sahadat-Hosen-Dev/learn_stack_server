                    example: Category updated successfully.
                  data:
                    allOf:
                      - type: object
                        properties:
                          _id:
                            type: string
                            example: 64fa38cce9a2d7f123456789
                          name:
                            type: string
                            example: science
                          description:
                            type: string
                            example: learn and take some knowledge.
                      - $ref: "#/components/schemas/Timestamp"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: /api/v1/categories/64fa38cce9a2d7f123456789
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
