components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Timestamp:
      type: object
      properties:
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required: [createdAt, updatedAt]
    Pagination:
      type: object
      properties:
        page:
          type: integer
          format: int32
          example: 2
        limit:
          type: integer
          format: int32
          example: 10
        next:
          type: integer
          format: int32
          example: 3
        prev:
          type: integer
          format: int32
          example: 1
        totalPages:
          type: integer
          format: int32
          example: 5
        totalItems:
          type: integer
          format: int32
          example: 50
      required:
        - page
        - limit
        - totalPage
        - totalItems
  responses:
    "500":
      description: "Internal Server Error"
      content:
        "application/json":
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 500
              error:
                type: string
                example: Internal Server Error
              message:
                type: string
                example: We are sorry for the inconvenience. Please try again later
    "400":
      description: "Bad Request"
      content:
        "application/json":
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 400
              error:
                type: string
                example: Bad Request
              data:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: field name
                    message:
                      type: string
                      example: Invalid field
                    in:
                      type: string
                      enum: [query, body]
                      example: body
    "401":
      description: Unauthorized
      content:
        "application/json":
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 401
              error:
                type: string
                example: Unauthorized
              message:
                type: string
                example: You don't have the right permissions
    "404":
      description: Resource Not Found
      content:
        "application/json":
          schema:
            type: object
            properties:
              code:
                type: integer
                format: int32
                example: 404
              error:
                type: string
                example: Not Found
              message:
                type: string
                example: Requested resource not found
  parameters:
    pageParam:
      in: query
      name: page
      description: current page number
      required: true
      schema:
        type: integer
        format: int32
        example: 2
    limitParam:
      in: query
      name: limit
      description: maximum items to be returned
      required: true
      schema:
        type: integer
        format: int32
        example: 10
    sortTypeParam:
      in: query
      name: sort_type
      description: type of sort (asc or dsc)
      schema:
        type: string
        enum: [asc, dsc]
        example: dsc
    statusParam:
      in: query
      name: status
      description: filter by status
      schema:
        type: string
        enum: [draft, published]
        example: draft
    accessTypeParam:
      in: query
      name: accessType
      description: filter by accessType
      schema:
        type: string
        enum: [free, basic, premium]
        example: free
    userStatusParam:
      in: query
      name: status
      description: filter by status
      schema:
        type: string
        enum: [super_admin, admin, manager, user]
        example: admin
    sortByParam:
      in: query
      name: sort_by
      description: Sort key
      schema:
        type: string
        example: updatedAt
    searchParam:
      in: query
      name: search
      description: Filter by title
      schema:
        type: string
        example: T-Shirt
    categoryIdParam:
      in: query
      name: categoryId
      description: Filter by categoryId
      schema:
        type: string
        example: 8fdjfd88499495498
    minPriceParam:
      in: query
      name: minPrice
      description: Minimum price filter
      required: false
      schema:
        type: number
        format: float
        example: 300
    idPathParam:
      in: path
      name: id
      required: true
      description: ID
      schema:
        type: string
    resourceIdPathParam:
      in: path
      name: resourceId
      required: true
      description: ID
      schema:
        type: string
    userIdParam:
      in: query
      name: userId
      description: Filter by user id
      schema:
        type: string
        example: 8fdjfd88499495498
    resourceIdParam:
      in: query
      name: resourceId
      description: Filter by resource id
      schema:
        type: string
        example: 8fdjfd88499495498
