openapi: 3.0.0
info:
  version: "1.0.0"
  title: "LearnStack Application API DOCUMENTATION"
  description: "This is a LearnStack Web Application API DOCUMENTATION"
  contact:
    name: Sahadat Hosen
    url: https://SahadatHosen.com
    email: sahadathosen.dev@gmail.com
servers:
  - description: Dev
    url: "http://localhost:4000"
tags:
  - name: Auth
    description: Authentication Endpoints (public)
  - name: Category
    description: Category Endpoints (public + private)
  - name: Resource
    description: Resource Endpoints (public + private)
  - name: Comment
    description: Comments Endpoints (public + private)
  - name: Reaction
    description: Reaction Endpoints (public + private)
  - name: User
    description: User Endpoints (private)
paths:
  "/api/v1/auth/register":
    post:
      description: create a new account
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: sahadat hosen
                credential:
                  type: string
                  format: email
                  example: hossantopu@gmail.com
                password:
                  type: string
                  format: password
                  example: pass1111
              required: [username, credential, password]
      responses:
        "201":
          description: Registration received. Please check your credentials for the verification OTP
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  message:
                    type: string
                    example: Registration received. Please check your credentials for the verification OTP
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/register"
                      login:
                        type: string
                        example: "/api/v1/auth/verifyRegisterOtp"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"

  "/api/v1/auth/verifyRegisterOtp":
    post:
      description: Verify Register OTP
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                credential:
                  type: string
                  format: email
                  example: hossantopu@gmail.com
                otp:
                  type: string
                  example: 34343
              required: [credential, otp]
      responses:
        "200":
          description: Email verified successfully.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 200
                  message:
                    type: string
                    example: Email verified successfully. You are now login.
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/verifyRegisterOtp"
                      login:
                        type: string
                        example: "/api/v1/auth/login"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"

  "/api/v1/auth/login":
    post:
      description: Log in to existing account
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                credential:
                  type: string
                  format: email
                  example: hossantopu@gmail.com
                password:
                  type: string
                  format: password
                  example: pass1111
              required: [credential, password]
      responses:
        "200":
          description: Login Successfully.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Login successfully.
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                        example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IkpvaG4gRG9lIiwiaWF0IjoxNTE2MjM5MDIyfQ.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/login"
                      register:
                        type: string
                        example: "/api/v1/auth/register"
                      forgetPassword:
                        type: string
                        example: "/api/v1/auth/forgetPassword"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"

  "/api/v1/auth/forgetPassword":
    post:
      description: Forget Password with OTP.
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                credential:
                  type: string
                  example: hossantopu@gmail.com
      responses:
        "200":
          description: OTP sent to this credential.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: object
                    example: OTP send to this credential.
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/forgetPassword"
                      resendResetOtp:
                        type: string
                        example: "/api/v1/auth/resendResetOtp"
                      verifyResetOtp:
                        type: string
                        example: "/api/v1/auth/verifyResetOtp"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"
  "/api/v1/auth/resendOtp":
    post:
      description: Resend forget OTP.
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                credential:
                  type: string
                  example: hossantopu@gmail.com
      responses:
        "200":
          description: New Otp send this credential.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: object
                    example: New Otp send this credential.
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/resendOtp"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"
  "/api/v1/auth/verifyResetOtp":
    post:
      description: Verify Reset OTP.
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                credential:
                  type: string
                  example: hossantopu@gmail.com
                otp:
                  type: string
                  example: 86548
      responses:
        "200":
          description: OTP verified. Now reset your password.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: object
                    example: OTP verified. Now reset your password.
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/verifyResetOtp"
                      resetPassword:
                        type: string
                        example: "/api/v1/auth/resetPassword"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"
  "/api/v1/auth/resetPassword":
    post:
      description: Reset Password.
      tags: [Auth]
      requestBody:
        content:
          "application/json":
            schema:
              type: object
              properties:
                credential:
                  type: string
                  example: hossantopu@gmail.com
                newPassword:
                  type: string
                  example: 45474
      responses:
        "200":
          description: Password reset successfully. Please login.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: object
                    example: Password reset successfully. Please login.
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        example: "/api/v1/auth/resetPassword"
                      login:
                        type: string
                        example: "/api/v1/auth/login"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"
  "/api/v1/resources":
    post:
      operationId: create resources
      security:
        - bearerAuth: []
      tags: [Resource]
      description: Create a new Resource
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                categoryId:
                  type: string
                  example: "64fa38cce9a2d7f123456789"
                title:
                  type: string
                  example: "TypeScript"
                description:
                  type: string
                  example: TypeScript is a strongly typed programming language that builds on JavaScript.
                content:
                  type: string
                  example: TypeScript stands in an unusual relationship to JavaScript. TypeScript offers all of JavaScripts features, and an additional layer on top of TypeScripts type system.
                accessType:
                  type: string
                  enum:
                    - free
                    - basic
                    - premium
                status:
                  type: string
                  enum:
                    - published
                    - draft
                image:
                  type: string
                  format: binary
              required:
                - categoryId
                - title
                - description
                - content
                - image

      responses:
        "201":
          description: Resource created successfully.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 201
                  message:
                    type: string
                    example: Resource created successfully.
                  data:
                    allOf:
                      - type: object
                        properties:
                          _id:
                            type: string
                            example: "64fa38cce9a2d7f123456789"
                          categoryId:
                            type: string
                            example: "64fa38cce9a2d7f123456780"
                          title:
                            type: string
                            example: "TypeScript"
                          description:
                            type: string
                            example: TypeScript is a strongly typed programming language that builds on JavaScript.
                          content:
                            type: string
                            example: TypeScript stands in an unusual relationship to JavaScript. TypeScript offers all of JavaScripts features, and an additional layer on top of TypeScripts type system.
                          accessType:
                            type: string
                            example: free
                          status:
                            type: string
                            example: draft
                          images:
                            type: string
                            example: https://cdn.com/resource/typescript.jpg
                      - $ref: "#/components/schemas/Timestamp"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: url
                        example: "/api/v1/resources/64fa38cce9a2d7f123456789"
                      category:
                        type: string
                        format: url
                        example: "/api/v1/categories/64fa38cce9a2d7f12345674453"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "500":
          $ref: "#/components/responses/500"
    get:
      security:
        - bearerAuth: []
      tags: [Resource]
      description: Retrive all published resource.
      parameters:
        - $ref: "#/components/parameters/pageParam"
        - $ref: "#/components/parameters/limitParam"
        - $ref: "#/components/parameters/sortTypeParam"
        - $ref: "#/components/parameters/sortByParam"
        - $ref: "#/components/parameters/categoryIdParam"
        - $ref: "#/components/parameters/searchParam"
        - $ref: "#/components/parameters/statusParam"
        - $ref: "#/components/parameters/accessTypeParam"
      responses:
        "200":
          description: Return a list of resources.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      allOf:
                        - type: object
                          properties:
                            _id:
                              type: string
                              example: "64fa38cce9a2d7f123456789"
                            category:
                              type: object
                              properties:
                                name:
                                  type: string
                                  example: programming
                                description:
                                  type: string
                                  example: Learn programming skills.
                            title:
                              type: string
                              example: "TypeScript"
                            description:
                              type: string
                              example: TypeScript is a strongly typed programming language that builds on JavaScript.
                            content:
                              type: string
                              example: TypeScript stands in an unusual relationship to JavaScript. TypeScript offers all of JavaScripts features, and an additional layer on top of TypeScripts type system.
                            accessType:
                              type: string
                              example: free
                            status:
                              type: string
                              example: draft
                            images:
                              type: string
                              example: https://cdn.com/resource/typescript.jpg
                              link:
                                type: object
                                properties:
                                  self:
                                    type: string
                                    format: url
                                    example: "/api/v1//products/64fa38cce9a2d7f123456789"
                          required:
                            - categoryId
                            - name
                            - pricing
                            - images
                        - $ref: "#/components/schemas/Timestamp"
                  pagination:
                    $ref: "#/components/schemas/Pagination"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: url
                        example: "/api/v1/resources?page=2&limit=10"
                      next:
                        type: string
                        format: url
                        example: "/api/v1/resources?page=3&limit=10"
                      prev:
                        type: string
                        format: url
                        example: "/api/v1/resources?page=1&limit=10"
        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"
  "/api/v1/resources/{id}":
    patch:
      security:
        - bearerAuth: []
      tags: [Resource]
      description: Partially update a Resource
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      requestBody:
        required: true
