                  example: TypeScript is a strongly typed programming language that builds on JavaScript.
                content:
                  type: string
                  example: TypeScript stands in an unusual relationship to JavaScript. TypeScript offers all of JavaScripts features, and an additional layer on top of TypeScripts type system.
                accessType:
                  type: string
                  enum:
                    - free
                    - basic
                    - premium
                status:
