                  enum:
                    - published
                    - draft
                image:
                  type: string
                  format: binary

      responses:
        "200":
          description: Resource updated successfully.
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 200
                  message:
                    type: string
                    example: Resource updated successfully.
                  data:
                    allOf:
                      - type: object
                        properties:
                          _id:
                            type: string
                            example: "64fa38cce9a2d7f123456789"
                          categoryId:
                            type: string
                            example: "64fa38cce9a2d7f123456780"
                          title:
                            type: string
                            example: "TypeScript"
                          description:
                            type: string
                            example: TypeScript is a strongly typed programming language that builds on JavaScript.
                          content:
                            type: string
                            example: TypeScript stands in an unusual relationship to JavaScript. TypeScript offers all of JavaScripts features, and an additional layer on top of TypeScripts type system.
                          accessType:
                            type: string
                            example: free
                          status:
                            type: string
                            example: draft
                          images:
                            type: string
                            example: https://cdn.com/resource/typescript.jpg
                      - $ref: "#/components/schemas/Timestamp"
                  links:
                    type: object
                    properties:
                      self:
                        type: string
                        format: url
                        example: "/api/v1/resources/64fa38cce9a2d7f123456789"
                      category:
                        type: string
                        format: url
                        example: "/api/v1/categories/64fa38cce9a2d7f12345676554"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    delete:
      security:
        - bearerAuth: []
      tags: [Resource]
      description: Delete a resource by id
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "204":
          description: "Resource deleted successfully"
          content:
            "application/json":
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    example: 204
                  message:
                    type: string
                    example: Resource deleted successfully.
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "404":
          $ref: "#/components/responses/404"
        "500":
          $ref: "#/components/responses/500"
    get:
      security:
        - bearerAuth: []
      tags: [Resource]
      description: Retrive  published resource by id
      parameters:
        - $ref: "#/components/parameters/idPathParam"
      responses:
        "200":
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - type: object
                        properties:
                          _id:
                            type: string
                            example: "64fa38cce9a2d7f123456789"
                          category:
                            type: object
                            properties:
                              name:
                                type: string
                                example: programming
                              description:
                                type: string
                                example: Learn programming skills.
                          title:
                            type: string
                            example: "TypeScript"
                          description:
                            type: string
                            example: TypeScript is a strongly typed programming language that builds on JavaScript.
                          content:
                            type: string
                            example: TypeScript stands in an unusual relationship to JavaScript. TypeScript offers all of JavaScripts features, and an additional layer on top of TypeScripts type system.
                          accessType:
                            type: string
                            example: free
                          status:
                            type: string
                            example: draft
                          images:
                            type: string
                            example: https://cdn.com/resource/typescript.jpg
                      - $ref: "#/components/schemas/Timestamp"
                  link:
                    type: object
                    properties:
                      self:
                        type: string
                        format: uri
                        example: "/api/v1/products/64fa38cce9a2d7f123456789"

        "400":
          $ref: "#/components/responses/400"
        "404":
          $ref: "#/components/responses/404"
        "500":
          "$ref": "#/components/responses/500"

  "/api/v1/categories":
    post:
      security:
        - bearerAuth: []
      tags: [Category]
      description: Create categories.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: programming
                description:
                  type: string
                  example: Learn programming.
              required:
                - name
                - description
      responses:
        "201":
          description: Create category
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    example: 201
                  message:
                    type: string
                    example: Category created successfully.
                  data:
                    allOf:
                      - type: object
                        properties:
                          _id:
                            type: string
                            example: "650f1b2a1c23d7f001234567"
                          name:
                            type: string
                            example: programming
                          description:
                            type: string
                            example: learn programming.
                      - $ref: "#/components/schemas/Timestamp"
                  links:
